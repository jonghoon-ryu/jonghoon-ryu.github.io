<!-- fonts: Pretendard (Korean + Latin) for text, JetBrains Mono for code.
     the Slate theme's own fonts (Myriad Pro, Calibri, Monaco, ...) have no
     Korean, so Korean used to fall back to whatever the reader's system had. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
<style>
body, h1, h2, h3, h4, h5, h6, th, .sidebar {
  font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui,
    'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
}
pre, code, kbd, tt, samp {
  font-family: 'JetBrains Mono', 'Pretendard Variable', Pretendard, ui-monospace, Menlo, Consolas, monospace;
}
</style>
