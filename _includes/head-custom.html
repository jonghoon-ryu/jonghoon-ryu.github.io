<!-- fonts: Maru Buri (Naver's serif; Korean and Latin) for text, JetBrains Mono for code.
     the Slate theme's own fonts (Myriad Pro, Calibri, Monaco, ...) have no
     Korean, so Korean used to fall back to whatever the reader's system had. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- dynamic subset: the browser downloads only the character ranges a page uses -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/MaruBuri/subsets/MaruBuri-dynamic-subset.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
<style>
body, h1, h2, h3, h4, h5, h6, th, .sidebar {
  font-family: 'Maru Buri', 'Noto Serif KR', AppleMyungjo, Batang, serif;
}
pre, code, kbd, tt, samp {
  font-family: 'JetBrains Mono', 'Maru Buri', ui-monospace, Menlo, Consolas, monospace;
}
</style>
