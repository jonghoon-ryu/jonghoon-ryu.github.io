---
layout: default
---
<article>
  <h1>{{ page.title }}</h1>
  <p class="post-meta">{{ page.date | date: "%B %-d, %Y" }}</p>
  {% if page.tags.size > 0 %}
  <p class="post-tags">
    {% for tag in page.tags %}<span class="tag-pill">{{ tag }}</span>{% endfor %}
  </p>
  {% endif %}
  {{ content }}
</article>
