<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">

  <head>
    <meta charset='utf-8'>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,maximum-scale=2">
    <link rel="stylesheet" type="text/css" media="screen" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <link rel="stylesheet" type="text/css" href="{{ '/assets/css/sidebar.css' | relative_url }}">

{% seo %}
{% feed_meta %}
    {% include head-custom.html %}
  </head>

  <body>
    <div class="page-wrap">
      <nav class="sidebar">
        <h1 class="sidebar-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
        <p class="sidebar-tagline">{{ site.description }}</p>
        <ul class="sidebar-nav">
          <li>
            <details class="nav-group" open>
              <summary><a href="{{ '/' | relative_url }}">Home</a></summary>
              <ul class="nav-subitems">
                <li><a href="{{ '/about/' | relative_url }}">About</a></li>
                <li><a href="{{ '/archive/' | relative_url }}">Archive</a></li>
              </ul>
            </details>
          </li>
          <li><a href="{{ '/feed.xml' | relative_url }}">RSS</a></li>
        </ul>
      </nav>

      <div id="main_content_wrap" class="outer">
        <section id="main_content" class="inner">
          {{ content }}
        </section>
      </div>
    </div>

    <!-- FOOTER  -->
    <div id="footer_wrap" class="outer">
      <footer class="inner">
        <p>Published with <a href="https://pages.github.com">GitHub Pages</a></p>
      </footer>
    </div>
  </body>
</html>
