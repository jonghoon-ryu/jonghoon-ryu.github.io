<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">

  <head>
    <meta charset='utf-8'>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,maximum-scale=2">
    <link rel="stylesheet" type="text/css" media="screen" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <link rel="stylesheet" type="text/css" href="{{ '/assets/css/sidebar.css' | relative_url }}">

{% seo %}
{% feed_meta %}
    {% include head-custom.html %}
  </head>

  <body>
    <div class="page-wrap">
      <nav class="sidebar">
        <h1 class="sidebar-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
        <ul class="sidebar-nav">
          <li>
            <details class="nav-group"{% if page.url == '/learning-cs/' or page.url == '/learning-cs/computation-theory/' or page.url contains '/learning-cs/os/' %} open{% endif %}>
              <summary><a href="{{ '/learning-cs/' | relative_url }}">Learning CS</a></summary>
              <ul class="nav-subitems">
                <li><a href="{{ '/learning-cs/os/' | relative_url }}">OS</a></li>
                <li><a href="{{ '/learning-cs/os/study-plan/' | relative_url }}">OS Study Plan</a></li>
                <li><a href="{{ '/learning-cs/computation-theory/' | relative_url }}">Computation Theory</a></li>
              </ul>
            </details>
          </li>
          <li>
            <details class="nav-group"{% if page.url contains '/learning-math/' %} open{% endif %}>
              <summary><a href="{{ '/learning-math/' | relative_url }}">Learning Math</a></summary>
              <ul class="nav-subitems">
                <li><a href="{{ '/learning-math/set-theory/' | relative_url }}">Set Theory</a></li>
              </ul>
            </details>
          </li>
        </ul>
      </nav>

      <div id="main_content_wrap" class="outer">
        <section id="main_content" class="inner">
          {{ content }}
        </section>
      </div>
    </div>

    <!-- FOOTER  -->
    <div id="footer_wrap" class="outer">
      <footer class="inner">
        <p>Published with <a href="https://pages.github.com">GitHub Pages</a></p>
      </footer>
    </div>

    <script>
      document.querySelectorAll('.nav-group > summary > a').forEach(function (link) {
        link.addEventListener('click', function (e) {
          var details = link.closest('details');
          if (details.open) {
            e.preventDefault();
            details.open = false;
          }
        });
      });
    </script>
  </body>
</html>
